[package]
name = "distributing-iterator"
version = "0.2.1"
edition = "2024"
publish = false
authors = ["Fetlife <dev@fetlife.com>", "Andrii Dmytrenko <refresh.xss@gmail.com>"]

[lib]
name = "distributing_iterator"
crate-type = ["cdylib", "lib"]

[dependencies]
magnus = { version = "0.8.2", optional = true }
csv = { version = "^1.3", optional = true }
fnv = "1.0.7"
indexmap = "2.8.0"
anyhow = "1.0.97"
rb-sys = { version = "0.9.126", default-features = false, features = ["stable-api-compiled-fallback"], optional = true }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[features]
default = ["csv"]
ruby_ext = ["dep:magnus", "dep:rb-sys", "csv"]
csv = ["dep:csv"]

[[bench]]
name = "benchmark_large_csv"
harness = false
